{% extends "base.html" %}

{% block title %} | CoderDojo {% endblock %}

{% block content %}
<h1>Contact us</h1>
{% if errors %}
<ul class="errors">
    {% for error in errors %}
    <li>{{ error }}</li>
    {% endfor %}
</ul>
{% endif %}
<form method="post" action="{{url_for('contact') }}" class="form">
    <label for="name"> Your name</label>
    <input type="text" id="name" name="name" value="{{ form.get('name', '') }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ form.get('email', '') }}">
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="4">{{ form.get('message', '') }}</textarea>

    <button class="submit" type="submit">Send</button>
</form>
{% endblock %}
